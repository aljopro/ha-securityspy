[project]
name = "ha-securityspy"
version = "0.1.0"
description = "Home Assistant custom integration for Ben Software SecuritySpy."
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Jensen Chappell", email = "aljopro@gmail.com" }]
# The integration declares its runtime requirement in `manifest.json`, which is
# what Home Assistant installs from (AD-14). Nothing is declared here so the two
# cannot drift; the library is a dev dependency only, for the test environment.
dependencies = []

# This repository ships a Home Assistant custom component, not an installable
# distribution: there is nothing for uv to build.
[tool.uv]
package = false

[dependency-groups]
dev = [
    # Pinned to the exact version `manifest.json` requires (AD-14): this
    # repository always consumes the published `aiosecurityspy` package, never
    # an in-tree copy. Bump both together. To test an unpublished library
    # change, publish it as a PyPI pre-release from the standalone
    # `aljopro/aiosecurityspy` repo (e.g. `0.2.1a1` -- pip/uv never resolve a
    # pre-release unless pinned exactly) and point this pin and `manifest.json`
    # at it temporarily; revert both once the real release ships.
    "aiosecurityspy==0.2.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-homeassistant-custom-component>=0.13",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# `pytest-homeassistant-custom-component` requires auto mode: its fixtures are
# plain async functions without an explicit asyncio marker.
asyncio_mode = "auto"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
src = ["custom_components", "tests"]
target-version = "py314"
# Agent tooling and BMAD workflow assets are not this repository's source.
extend-exclude = [
    ".agents",
    ".bmad-loop",
    ".claude",
    "_bmad",
    "_bmad-output",
]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "D", "DTZ", "E", "EM", "ERA",
    "F", "FA", "FBT", "G", "I", "ICN", "INP", "ISC", "LOG", "N", "PERF", "PGH",
    "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T20",
    "TC", "TID", "TRY", "UP", "W",
]
ignore = ["D203", "D213", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "D100", "D103"]
# Developer CLIs: stdout is the interface, so `print` is the point.
"scripts/*" = ["T201"]

[tool.ruff.lint.isort]
# `custom_components` is this repository's own code, not a dependency.
known-first-party = ["custom_components"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_unused_configs = true
disallow_any_generics = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
# `custom_components/` has no `__init__.py` chain up to the repository root, so
# mypy needs to be told where the package roots begin.
explicit_package_bases = true
mypy_path = "."

# `pytest-homeassistant-custom-component` ships no py.typed marker, so its
# helpers are untyped to mypy. Scoped to that module rather than made global, so
# a genuinely missing stub anywhere else still fails.
[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true
